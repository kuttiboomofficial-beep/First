name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare signing keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/moneymate-upload-key.jks

      - name: Build Debug APK and AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore/moneymate-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --version
          gradle assembleDebug bundleDebug

      - name: Build Signed Release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore/moneymate-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-debug-aab
          path: app/build/outputs/bundle/debug/*.aab

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-release-aab
          path: app/build/outputs/bundle/release/*.aab
