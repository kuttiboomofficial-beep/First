<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>MoneyMate V1.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{padding:20px 18px;background:#111827;color:#fff}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
nav{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}
nav button{background:#f1f5f9;padding:9px 12px;font-size:13px;white-space:nowrap}
nav button.active{background:#111827;color:#fff}
main{padding:15px 16px 85px}.tab{display:none}.tab.active{display:block}
.monthbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.monthbar select{flex:1}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px;border-radius:16px;background:#f8fafc;border:1px solid #e5e7eb}.card.full{grid-column:1/-1;background:#e2e8f0}.card small{color:#64748b}.card b{display:block;font-size:20px;margin-top:6px}.card.full b{font-size:28px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}button{border:0;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}.income{background:#dcfce7}.expense{background:#fee2e2}
.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 10px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.tx small{display:block;color:#64748b;margin-top:4px}.amt{font-weight:700}.plus{color:#15803d}.minus{color:#b91c1c}
.empty{text-align:center;color:#94a3b8;padding:28px 10px}
.progress{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;width:0;background:#334155}
.formrow{display:flex;gap:8px}.formrow>*{flex:1}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px}
.listbox{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:12px}.listline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee}.listline:last-child{border-bottom:0}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:end;justify-content:center;z-index:20}.modal-box{background:white;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:19px;max-height:90vh;overflow:auto}.row{display:flex;gap:9px;margin-top:14px}.row button{flex:1}.cancel{background:#e5e7eb}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:white;border-top:1px solid #e5e7eb;padding:9px;text-align:center;color:#64748b;font-size:12px;z-index:6}
</style>
</head>
<body>
<div class="app">
<header><h1>MoneyMate</h1><p>Simple Personal Finance Tracker • V1.1</p></header>
<nav>
<button class="active" onclick="showTab('dashboard',this)">Dashboard</button>
<button onclick="showTab('transactions',this)">Transactions</button>
<button onclick="showTab('budget',this)">Budget</button>
<button onclick="showTab('reports',this)">Reports</button>
</nav>
<main>
<section id="dashboard" class="tab active">
<div class="monthbar"><select id="monthFilter" onchange="renderAll()"></select><button onclick="setCurrentMonth()">Today</button></div>
<div class="cards">
<div class="card full"><small>Balance</small><b id="balance">₹0</b></div>
<div class="card"><small>Income</small><b id="income">₹0</b></div>
<div class="card"><small>Expense</small><b id="expense">₹0</b></div>
<div class="card"><small>Transactions</small><b id="count">0</b></div>
</div>
<div class="actions"><button class="income" onclick="openModal('income')">＋ Add Income</button><button class="expense" onclick="openModal('expense')">－ Add Expense</button></div>
<div class="section"><h2>Budget Status</h2><div id="budgetMini"></div></div>
</section>

<section id="transactions" class="tab">
<div class="monthbar"><select id="txMonth" onchange="renderTransactions()"></select><button onclick="openModal('income')">＋ Add</button></div>
<div id="list"></div>
</section>

<section id="budget" class="tab">
<h2>Monthly Budget</h2>
<label>Selected Month</label><select id="budgetMonth" onchange="renderBudget()"></select>
<label>Overall Monthly Budget (₹)</label><input id="budgetAmount" type="number" min="0" placeholder="e.g. 30000" oninput="saveBudget()">
<div id="budgetBox" class="listbox"></div>
</section>

<section id="reports" class="tab">
<h2>Monthly Report</h2>
<select id="reportMonth" onchange="renderReports()"></select>
<div id="reportBox" class="listbox"></div>
</section>
</main>
<footer>MoneyMate V1.1 • Offline • Data stays on this device</footer>
</div>

<div class="modal" id="modal"><div class="modal-box">
<h2 id="modalTitle">Add Transaction</h2>
<input type="hidden" id="editId">
<label>Type</label><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select>
<label>Category</label><select id="category"></select>
<label>Amount (₹)</label><input id="amount" type="number" min="0" placeholder="0">
<label>Date</label><input id="date" type="date">
<label>Note</label><input id="note" maxlength="80" placeholder="Optional">
<div class="row"><button class="cancel" onclick="closeModal()">Cancel</button><button onclick="saveTx()">Save</button></div>
</div></div>

<script>
const incomeCats=['Salary','Freelance','Business','Interest','Other'];
const expenseCats=['Food','Travel','Shopping','Bills','Rent','EMI','Medical','Education','Other'];
let transactions=JSON.parse(localStorage.getItem('moneymate_transactions')||'[]');
let budgets=JSON.parse(localStorage.getItem('moneymate_budgets')||'{}');

function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function ym(date){return String(date).slice(0,7)}
function currentYM(){return new Date().toISOString().slice(0,7)}
function months(){
 let a=[], d=new Date(); d.setDate(1);
 for(let i=0;i<13;i++){let s=d.toISOString().slice(0,7);a.push(s);d.setMonth(d.getMonth()-1)}
 return a;
}
function monthName(s){let [y,m]=s.split('-');return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function fillMonths(){
 ['monthFilter','txMonth','budgetMonth','reportMonth'].forEach(id=>{
  let el=document.getElementById(id), old=el.value||currentYM(); el.innerHTML=months().map(m=>`<option value="${m}">${monthName(m)}</option>`).join(''); el.value=old;
 });
}
function showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderAll()}
function setCurrentMonth(){['monthFilter','txMonth','budgetMonth','reportMonth'].forEach(id=>document.getElementById(id).value=currentYM());renderAll()}
function openModal(type,id=null){
 document.getElementById('modal').style.display='flex';document.getElementById('editId').value=id||'';document.getElementById('type').value=type;updateCats();
 if(id){let x=transactions.find(t=>t.id==id);document.getElementById('modalTitle').textContent='Edit Transaction';document.getElementById('category').value=x.category;document.getElementById('amount').value=x.amount;document.getElementById('date').value=x.date;document.getElementById('note').value=x.note||''}
 else{document.getElementById('modalTitle').textContent=type==='income'?'Add Income':'Add Expense';document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('amount').value='';document.getElementById('note').value=''}
}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('type').addEventListener('change',updateCats);
function updateCats(){let a=document.getElementById('type').value==='income'?incomeCats:expenseCats;document.getElementById('category').innerHTML=a.map(x=>`<option>${x}</option>`).join('')}
function saveTx(){
 let type=document.getElementById('type').value, amount=Number(document.getElementById('amount').value), id=document.getElementById('editId').value;
 if(!amount||amount<=0){alert('Amount enter pannunga');return}
 let obj={id:id?Number(id):Date.now(),type,amount,category:document.getElementById('category').value,date:document.getElementById('date').value,note:document.getElementById('note').value.trim()};
 if(id){let i=transactions.findIndex(x=>x.id==id);transactions[i]=obj}else transactions.unshift(obj);
 localStorage.setItem('moneymate_transactions',JSON.stringify(transactions));closeModal();renderAll();
}
function delTx(id){if(confirm('Delete this transaction?')){transactions=transactions.filter(x=>x.id!==id);localStorage.setItem('moneymate_transactions',JSON.stringify(transactions));renderAll()}}
function monthTx(m){return transactions.filter(x=>ym(x.date)===m)}
function renderDashboard(){
 let m=document.getElementById('monthFilter').value, t=monthTx(m), inc=t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0), exp=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
 income.textContent=money(inc);expense.textContent=money(exp);balance.textContent=money(inc-exp);count.textContent=t.length;
 let b=Number(budgets[m]||0), html=b?`<div class="listbox"><b>${money(exp)} / ${money(b)}</b><div class="progress"><i style="width:${Math.min(100,exp/b*100)}%"></i></div><small>${money(Math.max(0,b-exp))} remaining</small></div>`:'<div class="empty">Set a monthly budget to track spending.</div>';
 budgetMini.innerHTML=html;
}
function renderTransactions(){
 let m=document.getElementById('txMonth').value,t=monthTx(m),list=document.getElementById('list');
 if(!t.length){list.innerHTML='<div class="empty">No transactions for this month.</div>';return}
 list.innerHTML=t.map(x=>`<div class="tx"><div><b>${esc(x.category)}</b><small>${esc(x.date)}${x.note?' • '+esc(x.note):''}</small></div><div style="text-align:right"><div class="amt ${x.type==='income'?'plus':'minus'}">${x.type==='income'?'+':'-'}${money(x.amount)}</div><button onclick="openModal('${x.type}',${x.id})" style="padding:4px 7px;font-size:11px;background:#e2e8f0">Edit</button> <button onclick="delTx(${x.id})" style="padding:4px 7px;font-size:11px;background:#f1f5f9">Delete</button></div></div>`).join('');
}
function saveBudget(){let m=document.getElementById('budgetMonth').value;budgets[m]=Number(document.getElementById('budgetAmount').value)||0;localStorage.setItem('moneymate_budgets',JSON.stringify(budgets));renderBudget();renderDashboard()}
function renderBudget(){let m=budgetMonth.value,b=Number(budgets[m]||0),t=monthTx(m),exp=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);budgetAmount.value=b||'';budgetBox.innerHTML=b?`<b>Spent: ${money(exp)}</b><div class="progress"><i style="width:${Math.min(100,exp/b*100)}%"></i></div><b>${money(Math.max(0,b-exp))}</b> remaining<br><small>${exp>b?'Budget exceeded':'Budget available'}</small>`:'<div class="empty">Enter a budget amount above.</div>'}
function renderReports(){let m=reportMonth.value,t=monthTx(m),inc=t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0), cats={};t.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);let rows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="listline"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('');reportBox.innerHTML=`<div class="listline"><span>Total Income</span><b class="plus">${money(inc)}</b></div><div class="listline"><span>Total Expense</span><b class="minus">${money(exp)}</b></div><div class="listline"><span>Net Balance</span><b>${money(inc-exp)}</b></div><h3>Expense by Category</h3>${rows||'<small>No expenses.</small>'}`}
function renderAll(){renderDashboard();renderTransactions();renderBudget();renderReports()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
fillMonths();renderAll();
</script>
</body></html>
