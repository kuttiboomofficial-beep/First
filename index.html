<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>MoneyMate V1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{padding:22px 18px;background:#111827;color:#fff}
header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
main{padding:16px;padding-bottom:90px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{padding:16px;border-radius:16px;background:#f8fafc;border:1px solid #e5e7eb}
.card small{color:#64748b}.card b{display:block;font-size:20px;margin-top:7px}
.balance{grid-column:1/-1;background:#e2e8f0}
.balance b{font-size:28px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.income{background:#dcfce7}.expense{background:#fee2e2}
.section{margin-top:20px}.section h2{font-size:18px;margin:0 0 10px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee}
.tx small{display:block;color:#64748b;margin-top:4px}.amt{font-weight:700}.plus{color:#15803d}.minus{color:#b91c1c}
.empty{text-align:center;color:#94a3b8;padding:30px 10px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:end;justify-content:center}
.modal-box{background:white;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
.row{display:flex;gap:10px;margin-top:16px}.row button{flex:1}.cancel{background:#e5e7eb}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:white;border-top:1px solid #e5e7eb;padding:9px;text-align:center;color:#64748b;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header><h1>MoneyMate</h1><p>Simple Personal Finance Tracker</p></header>
<main>
<div class="cards">
<div class="card balance"><small>Current Balance</small><b id="balance">₹0</b></div>
<div class="card"><small>Total Income</small><b id="income">₹0</b></div>
<div class="card"><small>Total Expense</small><b id="expense">₹0</b></div>
</div>
<div class="actions">
<button class="income" onclick="openModal('income')">＋ Add Income</button>
<button class="expense" onclick="openModal('expense')">－ Add Expense</button>
</div>
<div class="section"><h2>Recent Transactions</h2><div id="list"></div></div>
</main>
<footer>MoneyMate V1 • Your data stays on this device</footer>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<h2 id="modalTitle">Add Transaction</h2>
<label>Type</label><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select>
<label>Category</label><select id="category"></select>
<label>Amount (₹)</label><input id="amount" type="number" min="0" placeholder="0">
<label>Date</label><input id="date" type="date">
<label>Note</label><input id="note" maxlength="80" placeholder="Optional">
<div class="row"><button class="cancel" onclick="closeModal()">Cancel</button><button onclick="saveTx()">Save</button></div>
</div></div>

<script>
const incomeCats=['Salary','Business','Freelance','Interest','Other'];
const expenseCats=['Food','Travel','Shopping','Bills','Rent','EMI','Medical','Other'];
let transactions=JSON.parse(localStorage.getItem('moneymate_transactions')||'[]');

function money(n){return '₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function openModal(type){
 document.getElementById('modal').style.display='flex';
 document.getElementById('type').value=type;
 document.getElementById('modalTitle').textContent=type==='income'?'Add Income':'Add Expense';
 document.getElementById('date').value=new Date().toISOString().slice(0,10);
 updateCats();
 document.getElementById('amount').value=''; document.getElementById('note').value='';
}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('type').addEventListener('change',updateCats);
function updateCats(){
 let arr=document.getElementById('type').value==='income'?incomeCats:expenseCats;
 document.getElementById('category').innerHTML=arr.map(x=>`<option>${x}</option>`).join('');
}
function saveTx(){
 const type=document.getElementById('type').value, amount=Number(document.getElementById('amount').value);
 if(!amount||amount<=0){alert('Amount enter pannunga');return}
 transactions.unshift({id:Date.now(),type,amount,category:document.getElementById('category').value,date:document.getElementById('date').value,note:document.getElementById('note').value.trim()});
 localStorage.setItem('moneymate_transactions',JSON.stringify(transactions)); closeModal(); render();
}
function delTx(id){
 if(confirm('Delete this transaction?')){transactions=transactions.filter(x=>x.id!==id);localStorage.setItem('moneymate_transactions',JSON.stringify(transactions));render();}
}
function render(){
 let inc=transactions.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0);
 let exp=transactions.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
 document.getElementById('income').textContent=money(inc);
 document.getElementById('expense').textContent=money(exp);
 document.getElementById('balance').textContent=money(inc-exp);
 const list=document.getElementById('list');
 if(!transactions.length){list.innerHTML='<div class="empty">No transactions yet.<br>Add your first income or expense.</div>';return}
 list.innerHTML=transactions.slice(0,20).map(x=>`
 <div class="tx">
  <div><b>${escapeHtml(x.category)}</b><small>${escapeHtml(x.date)}${x.note?' • '+escapeHtml(x.note):''}</small></div>
  <div style="text-align:right"><div class="amt ${x.type==='income'?'plus':'minus'}">${x.type==='income'?'+':'-'}${money(x.amount)}</div>
  <button onclick="delTx(${x.id})" style="padding:4px 7px;margin-top:5px;font-size:11px;background:#f1f5f9">Delete</button></div>
 </div>`).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
render();
</script>
</body></html>
